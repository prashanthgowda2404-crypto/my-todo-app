<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do App</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 20px; }
  .box { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  h1 { text-align: center; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; font-size: 16px; }
  button { padding: 10px 14px; border: none; background: #2f6fed; color: #fff; border-radius: 6px; font-size: 16px; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  li.done span { text-decoration: line-through; color: #999; }
  li button { background: #e74c3c; padding: 4px 10px; }
</style>
</head>
<body>
<div class="box">
  <h1>To-Do List</h1>
  <div class="row">
    <input id="task" placeholder="Add a task...">
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

  function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      li.innerHTML = `<span onclick="toggle(${i})">${t.text}</span><button onclick="remove(${i})">X</button>`;
      list.appendChild(li);
    });
  }

  function addTask() {
    const input = document.getElementById("task");
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text: text.replace(/</g, "&lt;"), done: false });
    input.value = "";
    save(); render();
  }

  function toggle(i) { tasks[i].done = !tasks[i].done; save(); render(); }
  function remove(i) { tasks.splice(i, 1); save(); render(); }

  render();
</script>
</body>
</html>
